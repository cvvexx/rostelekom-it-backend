services:

  users_db:
    image: postgres:16
    container_name: rostelekom_users_db
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${USERS_DB_USER:-user}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-12341234}
      POSTGRES_DB: ${USERS_DB_NAME:-users}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_users:/var/lib/postgresql/data

  keycloak_db:
    image: postgres:16
    container_name: rostelekom_keycloak_db
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak_db}
    ports:
      - "5434:5432"
    volumes:
      - pgdata_keycloak:/var/lib/postgresql/data


  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: rostelekom_keycloak
    restart: always
    command: start-dev --import-realm
    env_file:
      - .env.dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
      KC_HTTP_PORT: 8090
    ports:
      - "8090:8090"
    volumes:
      - ./.keycloak:/opt/keycloak/data/import:ro
    depends_on:
      - keycloak_db

volumes:
  pgdata_keycloak:
  pgdata_users: