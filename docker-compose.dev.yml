services:
  redis:
    image: redis:7
    container_name: rostelekom_redis
    restart: always
    ports:
      - "6379:6379"


  users_db:
    image: postgres:16
    container_name: rostelekom_users_db
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${USERS_DB_USER:-user}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-12341234}
      POSTGRES_DB: ${USERS_DB_NAME:-users}
    ports:
      - "55432:5432"
    volumes:
      - pgdata_users:/var/lib/postgresql/data

  billings_db:
    image: postgres:16
    container_name: rostelekom_billings_db
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${BILLINGS_DB_USER:-user}
      POSTGRES_PASSWORD: ${BILLINGS_DB_PASSWORD:-12341234}
      POSTGRES_DB: ${BILLINGS_DB_NAME:-billings}
    ports:
      - "55433:5432"
    volumes:
      - pgdata_billings:/var/lib/postgresql/data

  services_db:
    image: postgres:16
    container_name: rostelekom_services_db
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${SERVICES_DB_USER:-user}
      POSTGRES_PASSWORD: ${SERVICES_DB_PASSWORD:-12341234}
      POSTGRES_DB: ${SERVICES_DB_NAME:-services}
    ports:
      - "55434:5432"
    volumes:
      - pgdata_services:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: rostelekom_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0


volumes:
  pgdata_users:
  pgdata_billings:
  pgdata_services: