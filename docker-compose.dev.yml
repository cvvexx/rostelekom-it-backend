services:
  redis:
    image: redis:7
    container_name: rostelekom_redis
    restart: always
    ports:
      - "6379:6379"


  users_db:
    image: postgres:16
    container_name: rostelekom_users_db
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${USERS_DB_USER:-user}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-12341234}
      POSTGRES_DB: ${USERS_DB_NAME:-users}
    ports:
      - "55432:5432"
    volumes:
      - pgdata_users:/var/lib/postgresql/data

  billings_db:
    image: postgres:16
    container_name: rostelekom_billings_db
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${BILLINGS_DB_USER:-user}
      POSTGRES_PASSWORD: ${BILLINGS_DB_PASSWORD:-12341234}
      POSTGRES_DB: ${BILLINGS_DB_NAME:-billings}
    ports:
      - "55433:5432"
    volumes:
      - pgdata_billings:/var/lib/postgresql/data

  services_db:
    image: postgres:16
    container_name: rostelekom_services_db
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${SERVICES_DB_USER:-user}
      POSTGRES_PASSWORD: ${SERVICES_DB_PASSWORD:-12341234}
      POSTGRES_DB: ${SERVICES_DB_NAME:-services}
    ports:
      - "55434:5432"
    volumes:
      - pgdata_services:/var/lib/postgresql/data


volumes:
  pgdata_users:
  pgdata_billings:
  pgdata_services: