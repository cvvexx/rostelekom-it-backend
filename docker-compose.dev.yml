services:

  auth_db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports: [ "5433:5432" ]

  # Хранилище одноразовых кодов для входа по SMS (нативный TTL)
  redis:
    image: redis:7
    container_name: rostelekom_redis
    restart: always
    ports:
      - "6379:6379"


  users_db:
    image: postgres:16
    container_name: rostelekom_users_db
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${USERS_DB_USER:-user}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-12341234}
      POSTGRES_DB: ${USERS_DB_NAME:-users}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_users:/var/lib/postgresql/data

volumes:
  pgdata_users: