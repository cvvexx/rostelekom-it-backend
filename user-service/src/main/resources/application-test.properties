spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
keycloak.server-url=http://localhost:8080
keycloak.realm=test-realm
keycloak.client-id=test-client
keycloak.client-secret=test-secret
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/certs