spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

app.otp.store=memory
app.otp.length=6
app.otp.ttl=5m
app.otp.resend-cooldown=60s
app.otp.window=1h
app.otp.max-sends-per-window=5
app.otp.max-attempts=3
app.otp.expose-code=true

app.jwt.issuer=http://localhost:8081
app.jwt.audience=rostelekom
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=30d