spring.application.name=user-service
server.port=8081

spring.config.import=optional:file:.env.dev[.properties],optional:file:../.env.dev[.properties]

spring.datasource.url=jdbc:postgresql://${USERS_DB_HOST:localhost}:${USERS_DB_PORT:5432}/${USERS_DB_NAME:users}
spring.datasource.username=${USERS_DB_USER:user}
spring.datasource.password=${USERS_DB_PASSWORD:12341234}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.jwt.issuer=${JWT_ISSUER:http://localhost:8081}
app.jwt.audience=${JWT_AUDIENCE:rostelekom}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=30d
app.jwt.key-id=user-service-key
app.jwt.cleanup-interval=20000
app.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:}

app.otp.length=6
app.otp.ttl=5m
app.otp.resend-cooldown=60s
app.otp.window=1h
app.otp.max-sends-per-window=5
app.otp.max-attempts=5
app.otp.store=redis
app.otp.expose-code=${OTP_EXPOSE_CODE:true}

logging.level.org.springframework.security=DEBUG
spring.threads.virtual.enabled=true