spring.application.name=user-service
server.port=8081
keycloak.realm=rostelekom
keycloak.server-url=http://localhost:8090
keycloak.client-id=user-service-client
keycloak.admin-username=${KEYCLOAK_ADMIN:admin}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}
spring.datasource.url=jdbc:postgresql://${USERS_DB_HOST:localhost}:${USERS_DB_PORT:5432}/${USERS_DB_NAME:users}
spring.datasource.username=${USERS_DB_USER:user}
spring.datasource.password=${USERS_DB_PASSWORD:12341234}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.server-url:http://localhost:8090/realms/rostelekom}
keycloak.client-secret=${USER_SERVICE_KEYCLOAK_SECRET:D1L0RCyduSWXWrQMfDmwODwH8Zydf8HG}
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.client.RestClient=DEBUG