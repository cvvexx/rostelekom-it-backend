spring.application.name=billing-service
server.port=8082

USER_SERVICE_URI=http://localhost:8081
JWT_ISSUER=http://localhost:8081
JWT_AUDIENCE=rostelekom

spring.datasource.url=jdbc:postgresql://${BILLINGS_DB_HOST:localhost}:${BILLINGS_DB_PORT:55433}/${BILLINGS_DB_NAME:billings}
spring.datasource.username=${BILLINGS_DB_USER:user}
spring.datasource.password=${BILLINGS_DB_PASSWORD:12341234}

spring.config.import=optional:file:.env.dev[.properties],optional:file:../.env.dev[.properties]

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration


logging.level.org.springframework.security=DEBUG
spring.threads.virtual.enabled=true