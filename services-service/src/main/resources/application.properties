spring.application.name=services-service

rostelekom.uri.user-service=${USER_SERVICE_URI:http://localhost:8081}
rostelekom.uri.billing-service=${BILLING_SERVICE_URI:http://localhost:8082}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${rostelekom.uri.user-service}/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:rostelekom}

spring.threads.virtual.enabled=true

app.scheduling.enabled=true

app.subscription.charge-interval=PT1M
app.subscription.lease-ttl=300000
app.subscription.charge-retry-min-delay=PT1H
app.subscription.charge-retry-max-delay=PT24H
app.subscription.grace-period=P30D

app.service-auth.client-id=services-service
app.service-auth.client-secret=${SERVICES_SERVICE_SECRET:secret}

spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s