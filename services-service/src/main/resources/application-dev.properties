spring.application.name=services-service
server.port=8083

USER_SERVICE_URI=http://localhost:8081
BILLING_SERVICE_URI=http://localhost:8082
JWT_ISSUER=http://localhost:8081
JWT_AUDIENCE=rostelekom

spring.datasource.url=jdbc:postgresql://${SERVICES_DB_HOST:localhost}:${SERVICES_DB_PORT:55434}/${SERVICES_DB_NAME:services}
spring.datasource.username=${SERVICES_DB_USER:user}
spring.datasource.password=${SERVICES_DB_PASSWORD:12341234}

spring.config.import=optional:file:.env.dev[.properties],optional:file:../.env.dev[.properties]

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration


logging.level.org.springframework.security=DEBUG