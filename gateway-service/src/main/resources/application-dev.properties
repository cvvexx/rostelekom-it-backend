# Токены теперь выпускает user-service, а не Keycloak: подпись проверяем по его JWKS
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${USER_SERVICE_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:http://localhost:8081}
rostelekom.uri.user-service=${USER_SERVICE_URI:http://localhost:8081}
