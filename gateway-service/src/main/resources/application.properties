spring.application.name=gateway-service
server.port=8080

rostelekom.uri.user-service=${USER_SERVICE_URI}
rostelekom.uri.billing-service=${BILLING_SERVICE_URI}

rostelekom.rate-limit.capacity=100
rostelekom.rate-limit.window=1m

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${rostelekom.uri.user-service}/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE}


spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${rostelekom.uri.user-service}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.id=userService
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackUri=forward:/fallback/users

spring.cloud.gateway.server.webmvc.routes[1].id=user-service-auth
spring.cloud.gateway.server.webmvc.routes[1].uri=${rostelekom.uri.user-service}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.id=userService
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.fallbackUri=forward:/fallback/users

spring.cloud.gateway.server.webmvc.routes[2].id=billing-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${rostelekom.uri.billing-service}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/billing/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.id=billingService
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.fallbackUri=forward:/fallback/billing